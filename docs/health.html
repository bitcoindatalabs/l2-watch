<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Network Audit Dashboard - Security & Health</title>
    <!-- Bitcoin Data Labs styles -->
    <link rel="stylesheet" href="https://bitcoindatalabs.org/styles/styles.css" onerror="this.onerror=null;this.href='https://sorukumar.github.io/Bitcoin-Data-Labs/styles/styles.css'">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body class="has-fixed-header">
    <!-- Bitcoin Data Labs Header -->
    <div id="header"></div>
    <div class="main-content container">


        <style>
            .data-table { width: 100%; border-collapse: collapse; color: var(--text-secondary); font-size: 0.9rem; }
            .data-table th { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border-color); color: var(--text-primary); }
            .data-table td { padding: 0.75rem; border-bottom: 1px solid var(--border-color); font-family: monospace; }
        </style>

        <main>
                <div class="kpi-grid">
                    <div class="kpi-card warning">
                        <div class="kpi-label">Double Spends Detected</div>
                        <div class="kpi-value skeleton" id="kpi-double-spends"></div>
                    </div>
                    <div class="kpi-card warning">
                        <div class="kpi-label">Max Block Gap (Seconds)</div>
                        <div class="kpi-value skeleton" id="kpi-max-gap"></div>
                    </div>
                    <div class="kpi-card warning">
                        <div class="kpi-label">Total Block Anomalies</div>
                        <div class="kpi-value skeleton" id="kpi-anomalies"></div>
                    </div>
                </div>
        </main>

        <div class="dashboard-footer">
            <p>Data provided by local Liquid Elements node & Bitcoin Core verification. Data is updated daily.</p>
        </div>
    </div>

    <!-- Bitcoin Data Labs Footer -->
    <div id="footer"></div>

    <!-- Bitcoin Data Labs App Components -->
    <script src="https://bitcoindatalabs.org/components/app-components.js" onerror="this.onerror=null;this.src='https://sorukumar.github.io/Bitcoin-Data-Labs/components/app-components.js'"></script>
    <!-- App Configuration -->
    <script src="js/app-config.js"></script>

    <script src="js/app.js"></script>
</body>
</html>
